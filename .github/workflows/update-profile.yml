name: Update profile statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check python-dateutil requests lxml

      - name: Update profile SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: Pinnaclebc
        run: python today.py

      - name: Commit and push changed SVGs
        shell: bash
        run: |
          if git diff --quiet -- assets/dark_mode.svg assets/light_mode.svg; then
            echo "Profile SVGs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark_mode.svg assets/light_mode.svg
          git commit -m "Update GitHub profile statistics"
          git push
